# SPDX-License-Identifier: Apache-2.0
name: Release

# Builds the self-contained Linux archives with Dockerfile.release (Ubuntu 22.04 base, LLVM
# libraries and Clang headers shipped, verified on bare images) for amd64 and arm64, on every
# change to the release files and on demand. On a v* tag, the tag must match the project()
# version, and the archives with their checksums are attached to the GitHub Release.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile.release
      - .dockerignore
      - .github/workflows/release.yml
      - test/release/**
      - cmake/**
      - CMakeLists.txt
      - src/**
      - include/**
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_NAME: runtime-analyzer

jobs:
  build-archives:
    name: Build the Linux archive (${{ matrix.arch }})
    # Each architecture builds on a native runner: emulating arm64 on an x86 host takes far
    # longer for an LLVM-linked tool.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the project version
        if: github.ref_type == 'tag'
        run: |
          version="$(sed -n 's/^project(.* VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)"
          test -n "$version" || { echo "no project() VERSION in CMakeLists.txt"; exit 1; }
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match the project version $version"
            exit 1
          fi

      - name: Resolve the artifact version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "value=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, verify and export the archive
        run: |
          set -euo pipefail
          out_dir="dist/${{ matrix.arch }}"
          mkdir -p "$out_dir"
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --file Dockerfile.release \
            --target artifacts \
            --build-arg VERSION="${{ steps.version.outputs.value }}" \
            --build-arg PROJECT_NAME="$PROJECT_NAME" \
            --output "type=local,dest=$out_dir" \
            .
          ls -la "$out_dir"

      - name: Validate the artifact files
        run: |
          set -euo pipefail
          dir="dist/${{ matrix.arch }}"
          archive="$dir/$PROJECT_NAME-${{ steps.version.outputs.value }}-linux-${{ matrix.arch }}.tar.gz"
          test -f "$archive" || { echo "missing archive: $archive"; exit 1; }
          test -f "$archive.sha256" || { echo "missing checksum: $archive.sha256"; exit 1; }
          (cd "$dir" && sha256sum -c "$(basename "$archive.sha256")")

      - name: Upload the workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ steps.version.outputs.value }}-linux-${{ matrix.arch }}
          path: |
            dist/${{ matrix.arch }}/*.tar.gz
            dist/${{ matrix.arch }}/*.sha256
          if-no-files-found: error

  publish:
    name: Attach the archives to the GitHub Release
    runs-on: ubuntu-24.04
    needs: build-archives
    if: github.ref_type == 'tag'
    permissions:
      contents: write

    steps:
      - name: Download the archives
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.PROJECT_NAME }}-*-linux-*
          path: dist
          merge-multiple: true

      - name: Publish the release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
