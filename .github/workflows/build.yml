# SPDX-License-Identifier: Apache-2.0
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  LLVM_VERSION: 20

jobs:
  build:
    name: Build and test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM ${{ env.LLVM_VERSION }} (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y "llvm-$LLVM_VERSION-dev" "libclang-$LLVM_VERSION-dev" "clang-$LLVM_VERSION"
          echo "LLVM_DIR=/usr/lib/llvm-$LLVM_VERSION/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "Clang_DIR=/usr/lib/llvm-$LLVM_VERSION/lib/cmake/clang" >> "$GITHUB_ENV"

      - name: Install LLVM ${{ env.LLVM_VERSION }} (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja "llvm@$LLVM_VERSION"
          echo "LLVM_DIR=$(brew --prefix "llvm@$LLVM_VERSION")/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "Clang_DIR=$(brew --prefix "llvm@$LLVM_VERSION")/lib/cmake/clang" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR="$LLVM_DIR" -DClang_DIR="$Clang_DIR"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
